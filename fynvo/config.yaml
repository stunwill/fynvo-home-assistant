name: Fynvo
version: "1.8.0"
slug: fynvo
description: Household budgeting, cash-flow forecasting, financial calendar, goals, accounts, Cards, recurring payment reconciliation, transactions, CSV import, bank sync, spending intelligence and explainable financial health insights for Home Assistant.
url: https://github.com/stunwill/fynvo-home-assistant
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: application
