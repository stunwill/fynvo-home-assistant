  admin_display_name: ""
  admin_password: ""
  admin_recovery_mode: false
  session_days: 7
schema:
  admin_username: str?
  admin_display_name: str?
  admin_password: password?
  admin_recovery_mode: bool
  session_days: int(1,30)
