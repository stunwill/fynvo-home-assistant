name: Publish Fynvo release image

on:
  workflow_call:
    inputs:
      release_ref:
        description: "Release tag/ref to build, for example v1.25.1"
        required: false
        type: string
      source_ref:
        description: "Source branch/ref to build before merge, for example release/v1.25.1-post-production-corrections"
        required: false
        type: string
      version:
        description: "Semantic version without v prefix when source_ref is used"
        required: false
        type: string
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Release tag/ref to build, for example v1.25.1"
        required: false
        type: string
      source_ref:
        description: "Source branch/ref to build before merge"
        required: false
        type: string
      version:
        description: "Semantic version without v prefix when source_ref is used"
        required: false
        type: string

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/stunwill/fynvo
  IMAGE_NAMESPACE: ghcr.io/stunwill

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-latest
    outputs:
      source_ref: ${{ steps.ref.outputs.source_ref }}
      release_ref: ${{ steps.ref.outputs.release_ref }}
      version: ${{ steps.ref.outputs.version }}
    steps:
      - name: Resolve source ref and release version
        id: ref
        shell: bash
        env:
          CALLED_RELEASE_REF: ${{ inputs.release_ref }}
          CALLED_SOURCE_REF: ${{ inputs.source_ref }}
          CALLED_VERSION: ${{ inputs.version }}
          DISPATCH_RELEASE_REF: ${{ github.event.inputs.release_ref }}
          DISPATCH_SOURCE_REF: ${{ github.event.inputs.source_ref }}
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          RELEASE_REF="${CALLED_RELEASE_REF:-${DISPATCH_RELEASE_REF:-}}"
          SOURCE_REF="${CALLED_SOURCE_REF:-${DISPATCH_SOURCE_REF:-}}"
          VERSION="${CALLED_VERSION:-${DISPATCH_VERSION:-}}"

          if [[ -n "$RELEASE_REF" ]]; then
            if [[ ! "$RELEASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release ref must be vX.Y.Z: $RELEASE_REF" >&2
              exit 1
            fi
            VERSION="${RELEASE_REF#v}"
            SOURCE_REF="$RELEASE_REF"
          else
            if [[ -z "$SOURCE_REF" ]]; then
              SOURCE_REF="$GITHUB_REF_NAME"
            fi
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "A semantic X.Y.Z version is required when building a source ref: $VERSION" >&2
              exit 1
            fi
            RELEASE_REF="v${VERSION}"
          fi

          echo "source_ref=$SOURCE_REF" >> "$GITHUB_OUTPUT"
          echo "release_ref=$RELEASE_REF" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.source_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install metadata validator dependency
        run: python -m pip install pyyaml

      - name: Validate version and image contract
        env:
          FYNVO_RELEASE_TAG: ${{ steps.ref.outputs.release_ref }}
        run: python scripts/validate_release_metadata.py

  build:
    name: Build ${{ matrix.arch }} image
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
            build_from: ghcr.io/home-assistant/aarch64-base-python:3.12-alpine3.20
          - arch: amd64
            platform: linux/amd64
            build_from: ghcr.io/home-assistant/amd64-base-python:3.12-alpine3.20
          - arch: armhf
            platform: linux/arm/v6
            build_from: ghcr.io/home-assistant/armhf-base-python:3.12-alpine3.20
          - arch: armv7
            platform: linux/arm/v7
            build_from: ghcr.io/home-assistant/armv7-base-python:3.12-alpine3.20
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source_ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve build metadata
        id: metadata
        run: |
          echo "version=${{ needs.validate.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and publish architecture image
        uses: docker/build-push-action@v6
        with:
          context: ./fynvo
          file: ./fynvo/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.arch }}-fynvo:${{ steps.metadata.outputs.version }}
          build-args: |
            BUILD_FROM=${{ matrix.build_from }}
            BUILD_VERSION=${{ steps.metadata.outputs.version }}
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_REVISION=${{ github.sha }}
            BUILD_CREATED=${{ steps.metadata.outputs.created }}
          cache-from: type=gha,scope=fynvo-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=fynvo-${{ matrix.arch }}

  manifest:
    name: Publish multi-architecture manifest
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish version manifest
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_REF: ${{ needs.validate.outputs.release_ref }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${VERSION}" \
            --tag "${IMAGE_NAME}:${RELEASE_REF}" \
            "${IMAGE_NAMESPACE}/aarch64-fynvo:${VERSION}" \
            "${IMAGE_NAMESPACE}/amd64-fynvo:${VERSION}" \
            "${IMAGE_NAMESPACE}/armhf-fynvo:${VERSION}" \
            "${IMAGE_NAMESPACE}/armv7-fynvo:${VERSION}"

      - name: Verify published manifest
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE_NAME}:${VERSION}" --raw > manifest.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("manifest.json").read_text())
          expected = {
              ("linux", "amd64", None),
              ("linux", "arm64", None),
              ("linux", "arm", "v6"),
              ("linux", "arm", "v7"),
          }
          actual = {
              (item.get("platform", {}).get("os"), item.get("platform", {}).get("architecture"), item.get("platform", {}).get("variant"))
              for item in payload.get("manifests", [])
          }
          missing = expected - actual
          if missing:
              raise SystemExit(f"Published manifest is missing platforms: {sorted(missing)}")
          print(f"Verified release manifest platforms: {sorted(actual)}")
          PY

      - name: Verify exact Home Assistant image reference anonymously
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          docker logout ghcr.io >/dev/null 2>&1 || true
          docker buildx imagetools inspect "${IMAGE_NAME}:${VERSION}" >/dev/null
          docker pull --platform linux/amd64 "${IMAGE_NAME}:${VERSION}" >/dev/null
          echo "Anonymous registry resolution and pull succeeded for ${IMAGE_NAME}:${VERSION}"
