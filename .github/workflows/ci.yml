name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fynvo/backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r fynvo/backend/requirements.txt
          pip install ruff
      - name: Compile Python sources
        run: python -m compileall fynvo/backend/app
      - name: Ruff lint
        run: ruff check --ignore DTZ011 fynvo/backend/app fynvo/backend/tests
      - name: Run backend tests
        run: PYTHONPATH=fynvo/backend pytest fynvo/backend/tests
      - name: Import application
        run: PYTHONPATH=fynvo/backend python -c "from app.main import app; print(app.title)"

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: fynvo/frontend
        run: npm install
      - name: Run frontend regression tests
        working-directory: fynvo/frontend
        run: npm test
      - name: Build frontend
        working-directory: fynvo/frontend
        run: npm run build

  addon:
    name: Home Assistant add-on checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate YAML
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in (Path("repository.yaml"), Path("fynvo/config.yaml"), Path("fynvo/build.yaml")):
              with path.open("r", encoding="utf-8") as handle:
                  yaml.safe_load(handle)
              print(f"Validated {path}")
          PY
      - name: Validate release metadata contract
        run: python scripts/validate_release_metadata.py
      - name: Validate required app metadata
        run: |
          python - <<'PY'
          import yaml

          with open("fynvo/config.yaml", "r", encoding="utf-8") as handle:
              config = yaml.safe_load(handle)

          required = ["name", "version", "slug", "description", "arch", "startup", "boot"]
          missing = [key for key in required if key not in config]
          if missing:
              raise SystemExit(f"Missing required config.yaml keys: {', '.join(missing)}")
          if config.get("slug") != "fynvo":
              raise SystemExit("config.yaml slug must be 'fynvo'")
          if config.get("ingress_port") != 8097:
              raise SystemExit("config.yaml ingress_port must be 8097")
          print(f"Home Assistant app metadata looks valid for Fynvo {config['version']}")
          PY
      - name: Build Docker image
        working-directory: fynvo
        run: docker build --build-arg BUILD_FROM=ghcr.io/home-assistant/amd64-base-python:3.12-alpine3.20 -t fynvo-ci .
