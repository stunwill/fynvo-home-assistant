name: Release Fynvo

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to release, without v prefix (for example 1.24.2)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: fynvo-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      tag_exists: ${{ steps.version.outputs.tag_exists }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve and validate release version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          CONFIG_VERSION="$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path("fynvo/config.yaml").read_text(encoding="utf-8")
          match = re.search(r'^version:\s*["\']?([^"\'\s]+)["\']?\s*$', text, re.MULTILINE)
          print(match.group(1) if match else "")
          PY
          )"
          if [[ -z "$CONFIG_VERSION" ]]; then
            echo "Could not read version from fynvo/config.yaml" >&2
            exit 1
          fi
          VERSION="$REQUESTED_VERSION"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be semantic X.Y.Z without a v prefix: $VERSION" >&2
            exit 1
          fi
          if [[ "$CONFIG_VERSION" != "$VERSION" ]]; then
            echo "fynvo/config.yaml advertises $CONFIG_VERSION, not requested $VERSION" >&2
            exit 1
          fi
          TAG="v${VERSION}"
          TAG_EXISTS=false
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            TAG_EXISTS=true
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "tag_exists=$TAG_EXISTS" >> "$GITHUB_OUTPUT"

      - name: Validate repository release metadata
        env:
          FYNVO_RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          python -m pip install pyyaml
          python scripts/validate_release_metadata.py

  create_tag:
    name: Create release tag
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create and push release tag when missing
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          TAG_EXISTS: ${{ needs.prepare.outputs.tag_exists }}
        run: |
          set -euo pipefail
          if [[ "$TAG_EXISTS" == "true" ]]; then
            echo "$TAG already exists; reusing it."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Fynvo v${VERSION}"
          git push origin "$TAG"

  publish_image:
    name: Build and verify Home Assistant image
    needs: [prepare, create_tag]
    uses: ./.github/workflows/release-image.yml
    with:
      release_ref: ${{ needs.prepare.outputs.tag }}
    secrets: inherit

  publish_release:
    name: Publish GitHub release
    needs: [prepare, publish_image]
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact Home Assistant image reference anonymously
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          docker logout ghcr.io >/dev/null 2>&1 || true
          docker buildx imagetools inspect "ghcr.io/stunwill/fynvo:${VERSION}" >/dev/null
          docker pull --platform linux/amd64 "ghcr.io/stunwill/fynvo:${VERSION}" >/dev/null
          echo "Verified ghcr.io/stunwill/fynvo:${VERSION}"

      - name: Create or update GitHub Release after image verification
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$REPO" --title "$TAG" --latest
          else
            gh release create "$TAG" \
              --repo "$REPO" \
              --title "$TAG" \
              --generate-notes \
              --latest
          fi

      - name: Release readiness summary
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          {
            echo "## Fynvo ${VERSION} released"
            echo
            echo "Tag: \`${TAG}\`"
            echo
            echo "Home Assistant image was anonymously resolved and pulled before GitHub Release publication:"
            echo "\`ghcr.io/stunwill/fynvo:${VERSION}\`"
          } >> "$GITHUB_STEP_SUMMARY"
